name: GitHub Pages

# Publishes the static "What is WebJs?" answer page at
# https://webjsdev.github.io/webjs/ from seo/github-pages/ on main.
#
# WHY THIS EXISTS: "what is webjs" is a contested query. Several unrelated
# projects share the name (whatsapp-web.js, a dormant 2013 Java framework, a
# small client-side toolkit), and the page that currently wins it is the Java
# one, on the strength of an exact-match title alone. This is a third surface
# answering the query, alongside webjs.dev/what-is-webjs and the repo README.
#
# WHY ACTIONS RATHER THAN A gh-pages BRANCH: the deployment is built straight
# from main by the first-party Pages actions, so there is no orphan branch to
# force-push, no generated commits in history, and exactly one source of truth
# (seo/github-pages/). Repo Settings > Pages > Source must be set to
# "GitHub Actions" for this to take effect.
#
# CAVEAT worth knowing before anyone invests more here: github.io is on the
# Public Suffix List, so webjsdev.github.io inherits ZERO domain authority from
# github.com. It starts cold. The repo itself carries GitHub's authority, which
# is why the README matters more than this page does.

on:
  push:
    branches: [main]
    paths:
      - 'seo/github-pages/**'
      - '.github/workflows/pages.yml'
  # Allows a manual republish from the Actions tab without touching the source.
  workflow_dispatch:

# Read the repo, mint the Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Never cancel an in-flight one, or Pages can be left
# pointing at a half-finished upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Guard the one thing that would silently defeat the page's purpose: an
      # edit that drops the exact-match title or h1 the page is built to rank
      # for. Cheap, and it fails the deploy rather than shipping a dud.
      - name: Verify the page still answers the query
        run: |
          grep -q '<title>What is WebJs?' seo/github-pages/index.html
          grep -q '<h1>What is WebJs?</h1>' seo/github-pages/index.html
          grep -q 'application/ld+json' seo/github-pages/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: seo/github-pages

      - id: deployment
        uses: actions/deploy-pages@v4
